[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcr-spark-architecture"
version = "0.1.0"
description = "Minimal reference implementation of the SPARK qPCR curve classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=1.12",
  "torchvision>=0.13",
  "numpy>=1.21,<2",
  "Pillow>=9",
  "matplotlib>=3.5",
]

[project.scripts]
spark-predict = "spark.cli:main"
spark-train = "spark.train:main"

[tool.setuptools.packages.find]
include = ["spark*"]
